# =============================================================================
# Auto-sync with upstream shadowsocks/shadowsocks-libev
#
# Runs on schedule and manual trigger. Checks the latest *stable* release
# (not pre-release) in the upstream repo. If a new release tag doesn't exist
# in this fork yet:
#   1. Fetches and merges upstream master into fork master
#   2. Creates and pushes the same tag (e.g. v3.3.6)
#   3. The tag push triggers cross-compile-arm64 and build-x64-static workflows
#   4. Those workflows build static binaries and create the GitHub Release
# =============================================================================
name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours
  workflow_dispatch:           # manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/shadowsocks/shadowsocks-libev.git
          git fetch upstream --tags

      # -----------------------------------------------------------------
      # Find the latest stable (non-prerelease) upstream release tag
      # -----------------------------------------------------------------
      - name: Detect latest upstream stable release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query the upstream repo for its latest non-prerelease release
          UPSTREAM_TAG=$(gh release view --repo shadowsocks/shadowsocks-libev \
            --json tagName,isPrerelease --jq '.tagName') || {
              echo "No releases found in upstream — nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            }

          # Double-check it's not a prerelease
          IS_PRE=$(gh release view "$UPSTREAM_TAG" --repo shadowsocks/shadowsocks-libev \
            --json isPrerelease --jq '.isPrerelease')
          if [ "$IS_PRE" = "true" ]; then
            echo "Latest upstream release $UPSTREAM_TAG is a pre-release — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream latest stable release: $UPSTREAM_TAG"

          # Check if this tag already exists in the fork
          if git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_TAG already exists in fork — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream release detected: $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Merge upstream master into fork master
      # -----------------------------------------------------------------
      - name: Merge upstream
        if: steps.detect.outputs.skip != 'true'
        run: |
          git merge upstream/master --no-edit --allow-unrelated-histories || {
            # If merge conflicts occur, try to resolve by preferring upstream
            # for source files, but keep our workflow/README changes
            echo "::warning::Merge conflicts detected, attempting resolution..."
            # List conflicted files
            git diff --name-only --diff-filter=U
            # For all conflicted files except our custom files, take upstream version
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                .github/*|README.md|README_pt_BR.md|CLAUDE.md|docker/*)
                  echo "Keeping our version of: $f"
                  git checkout --ours "$f" 2>/dev/null || true
                  ;;
                *)
                  echo "Taking upstream version of: $f"
                  git checkout --theirs "$f" 2>/dev/null || true
                  ;;
              esac
              git add "$f" 2>/dev/null || true
            done
            git commit --no-edit || {
              echo "::error::Could not resolve merge conflicts automatically."
              exit 1
            }
          }

      # -----------------------------------------------------------------
      # Push merged master and create the release tag
      # -----------------------------------------------------------------
      - name: Push and tag
        if: steps.detect.outputs.skip != 'true'
        env:
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream_tag }}
        run: |
          # Push the merged master
          git push origin master

          # Create and push the tag — this triggers the build workflows
          git tag "$UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG"

          echo "Tag $UPSTREAM_TAG pushed. Build workflows will start automatically."
